# Viagiro - Ping quotidien pour que le projet Supabase gratuit ne soit pas mis en pause.
# À placer dans le dépôt GitHub sous : .github/workflows/keepalive.yml
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours vers 6 h 17 (heure UTC)
  workflow_dispatch:        # permet aussi de le lancer à la main pour tester

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête vers Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Nettoyage : retire espaces, retours à la ligne, guillemets et "/" final
          URL="$(printf '%s' "$SUPABASE_URL" | sed -e 's/[[:space:]]//g' -e "s/[\"']//g" -e 's#/*$##')"
          KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | sed -e 's/[[:space:]]//g' -e "s/[\"']//g")"

          if [ -z "$URL" ]; then
            echo "ERREUR : le secret SUPABASE_URL est vide ou introuvable (nom exact, secret de dépôt)."
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "ERREUR : le secret SUPABASE_ANON_KEY est vide ou introuvable (nom exact, secret de dépôt)."
            exit 1
          fi
          case "$URL" in
            https://*.supabase.co) ;;
            *)
              echo "ERREUR : SUPABASE_URL doit ressembler à https://xxxxxxxx.supabase.co"
              echo "(longueur reçue : ${#URL} caractères, début : ${URL:0:8})"
              exit 1
              ;;
          esac

          curl -sS --fail --retry 3 --retry-delay 10 \
            -o /dev/null -w "Réponse de Supabase : HTTP %{http_code}\n" \
            "$URL/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
