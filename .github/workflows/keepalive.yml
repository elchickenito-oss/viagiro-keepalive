# Viagiro - Ping quotidien pour que le projet Supabase gratuit ne soit pas mis en pause.
# À placer dans le dépôt GitHub sous : .github/workflows/keepalive.yml
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours vers 6 h 17 (heure UTC)
  workflow_dispatch:        # permet aussi de le lancer à la main pour tester

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête vers Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
